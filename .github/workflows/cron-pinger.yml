name: Cron pinger

# LuthCal deploys on Vercel Hobby, which REJECTS a deployment whose vercel.json
# declares any sub-daily cron (and caps cron jobs hard). So vercel.json carries
# NO crons, and this workflow drives ALL of LuthCal's scheduled work on GitHub
# Actions' scheduler by pinging the /api/cron/* endpoints. Which endpoints fire
# is decided by which `schedule:` entry triggered the run (github.event.schedule).
#
# GitHub Actions `schedule:` is best-effort, not exact — runs can be delayed
# (more so under load) and have a ~5-minute floor. A reminder or digest landing
# a few minutes late is fine for a family calendar. Times below are UTC; the
# intended local times assume America/Chicago (FAMILY_TZ).
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   APP_BASE_URL  - deployed https URL, e.g. https://luthcal.vercel.app (no trailing slash)
#   CRON_SECRET   - same value as the Vercel env var; sent as `Authorization: Bearer <CRON_SECRET>`
# Full rationale + cadence in docs/cron-pinger.md.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 min: reminders + announce + outbound-queue retry
    - cron: "0 12 * * *"   # ~07:00 America/Chicago daily: daily digest
    - cron: "0 23 * * 0"   # ~18:00 America/Chicago Sunday: weekly (week-ahead) digest
    - cron: "30 9 * * *"   # off-peak daily: Google watch-channel renewal
  workflow_dispatch:

concurrency:
  group: cron-pinger
  cancel-in-progress: false

jobs:
  ping:
    name: ping scheduled cron endpoints
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SCHEDULE: ${{ github.event.schedule }}
    steps:
      - name: Ping the endpoints for whichever schedule fired
        run: |
          set -u

          if [ -z "${APP_BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            # Not configured yet (expected until the app is deployed and the
            # repo secrets are set). Skip quietly and succeed so scheduled runs
            # don't email the repo owner every tick. Once the secrets exist this
            # guard is skipped and real ping failures fail loudly.
            echo "::notice::APP_BASE_URL/CRON_SECRET not set yet — skipping ping (see docs/cron-pinger.md)"
            exit 0
          fi

          base="${APP_BASE_URL%/}"

          # Map the triggering schedule to the endpoints it should ping.
          # workflow_dispatch (manual, empty SCHEDULE) runs the frequent sweeps.
          case "${SCHEDULE:-}" in
            "0 12 * * *")   paths="/api/cron/digest?kind=daily" ;;
            "0 23 * * 0")   paths="/api/cron/digest?kind=weekly" ;;
            "30 9 * * *")   paths="/api/cron/renew-watch" ;;
            *)              paths="/api/cron/reminders /api/cron/announce /api/cron/outbound /api/cron/inbound" ;;
          esac

          overall_status=0
          for path in $paths; do
            url="${base}${path}"
            echo "Pinging ${path} ..."

            http_code=$(curl -sS -o /tmp/cron-pinger-body.txt -w "%{http_code}" \
              --max-time 60 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${url}") || http_code="000"

            body=$(cat /tmp/cron-pinger-body.txt 2>/dev/null || true)

            if [ "${http_code}" -ge 200 ] && [ "${http_code}" -lt 300 ]; then
              echo "  ok (${http_code}): ${body}"
            else
              echo "::error::${path} returned non-2xx status ${http_code}: ${body}"
              overall_status=1
            fi
          done

          exit "${overall_status}"
