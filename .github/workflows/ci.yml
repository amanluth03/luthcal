name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # These must all pass with NO environment variables set — the app is
      # built to be safe during `next build` without a database or secrets
      # (see lib/db/index.ts getDb() lazy init). Do not add env here.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # --passWithNoTests keeps CI green before the first tests land; once the
      # suite exists (tests/), Vitest runs it normally.
      - name: Test
        run: npm test -- --passWithNoTests
